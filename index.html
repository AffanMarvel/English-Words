<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2000 English Words — Affan's Vocab Book</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;700&display=swap');

  :root {
    --gold: #f5c518;
    --purple: #9d4edd;
    --blue: #00d4ff;
    --bg: #0a0a0f;
    --surface: #12121a;
    --card: #1a1a26;
    --text: #e8e8f0;
    --muted: #888;
    --green: #00ff88;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: linear-gradient(135deg, #0a0a0f 0%, #1a0a2e 50%, #0a0a0f 100%);
    border-bottom: 2px solid var(--gold);
    padding: 30px 20px 20px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 40px rgba(157,78,221,0.3);
  }

  header h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(18px, 4vw, 32px);
    color: var(--gold);
    letter-spacing: 3px;
    text-shadow: 0 0 30px rgba(245,197,24,0.5);
  }

  header p {
    color: var(--blue);
    font-size: 13px;
    letter-spacing: 2px;
    margin-top: 5px;
    font-family: 'Orbitron', sans-serif;
  }

  /* PROGRESS */
  .progress-wrap {
    background: var(--surface);
    border: 1px solid #2a2a3a;
    border-radius: 12px;
    padding: 16px 20px;
    margin: 20px auto;
    max-width: 1200px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .progress-bar-outer {
    flex: 1;
    background: #1e1e2e;
    border-radius: 50px;
    height: 14px;
    min-width: 150px;
    overflow: hidden;
    border: 1px solid #333;
  }

  .progress-bar-inner {
    height: 100%;
    background: linear-gradient(90deg, var(--purple), var(--gold));
    border-radius: 50px;
    transition: width 0.4s ease;
  }

  .progress-text {
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    color: var(--gold);
    white-space: nowrap;
  }

  .stat-pill {
    background: #1e1e2e;
    border: 1px solid var(--purple);
    border-radius: 20px;
    padding: 4px 14px;
    font-size: 12px;
    color: var(--blue);
    font-family: 'Orbitron', sans-serif;
  }

  /* CONTROLS */
  .controls {
    max-width: 1200px;
    margin: 0 auto 16px;
    padding: 0 16px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }

  input[type="text"] {
    background: var(--card);
    border: 1px solid var(--purple);
    border-radius: 8px;
    padding: 10px 16px;
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    flex: 1;
    min-width: 180px;
    outline: none;
  }

  input[type="text"]:focus { border-color: var(--gold); box-shadow: 0 0 10px rgba(245,197,24,0.2); }

  select {
    background: var(--card);
    border: 1px solid var(--purple);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    outline: none;
    cursor: pointer;
  }

  .btn {
    padding: 9px 18px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    letter-spacing: 1px;
    transition: all 0.2s;
  }

  .btn-gold { background: var(--gold); color: #000; }
  .btn-gold:hover { box-shadow: 0 0 14px rgba(245,197,24,0.5); }
  .btn-purple { background: var(--purple); color: #fff; }
  .btn-purple:hover { box-shadow: 0 0 14px rgba(157,78,221,0.5); }
  .btn-blue { background: transparent; border: 1px solid var(--blue); color: var(--blue); }
  .btn-blue:hover { background: var(--blue); color: #000; }

  /* TABLE WRAP */
  .table-wrap {
    max-width: 1200px;
    margin: 0 auto 40px;
    padding: 0 16px;
  }

  .level-title {
    font-family: 'Cinzel', serif;
    font-size: 18px;
    color: var(--gold);
    border-left: 4px solid var(--gold);
    padding: 12px 16px;
    margin: 30px 0 12px;
    background: linear-gradient(90deg, rgba(245,197,24,0.08), transparent);
    letter-spacing: 2px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 30px rgba(0,0,0,0.4);
    margin-bottom: 20px;
  }

  thead tr {
    background: linear-gradient(90deg, #1e0a3c, #0a1e3c);
    border-bottom: 2px solid var(--gold);
  }

  thead th {
    padding: 14px 12px;
    text-align: left;
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    color: var(--gold);
    letter-spacing: 2px;
    white-space: nowrap;
  }

  tbody tr {
    border-bottom: 1px solid #1e1e2e;
    transition: background 0.2s;
  }

  tbody tr:hover { background: rgba(157,78,221,0.07); }

  tbody tr.learned {
    background: rgba(0,255,136,0.04);
    opacity: 0.65;
  }

  tbody tr.learned td { color: #666; }
  tbody tr.learned td:nth-child(2) { text-decoration: line-through; color: var(--green); }

  td {
    padding: 11px 12px;
    vertical-align: middle;
    line-height: 1.4;
  }

  td:first-child { color: var(--muted); font-size: 12px; width: 46px; text-align: center; }
  td:nth-child(2) { font-weight: 700; color: #fff; font-size: 16px; }
  td:nth-child(3) { color: var(--blue); font-size: 13px; font-style: italic; }
  td:nth-child(4) { color: var(--gold); font-weight: 600; }
  td:nth-child(5) { color: #aaa; font-size: 13px; max-width: 260px; }
  td:last-child { text-align: center; width: 60px; }

  /* CHECKBOX */
  .cb-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .cb-wrap input[type="checkbox"] {
    display: none;
  }

  .cb-label {
    width: 28px;
    height: 28px;
    border: 2px solid var(--purple);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.25s;
    font-size: 16px;
    color: transparent;
    background: transparent;
    user-select: none;
  }

  .cb-wrap input:checked + .cb-label {
    background: var(--green);
    border-color: var(--green);
    color: #000;
    box-shadow: 0 0 10px rgba(0,255,136,0.4);
  }

  /* HIDDEN ROW */
  tr[data-hidden="true"] { display: none; }

  /* FOOTER */
  footer {
    text-align: center;
    padding: 30px;
    color: var(--muted);
    font-size: 12px;
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 2px;
    border-top: 1px solid #1e1e2e;
  }

  /* BADGE */
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 10px;
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 1px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .badge-1 { background: rgba(0,212,255,0.15); color: var(--blue); border: 1px solid var(--blue); }
  .badge-2 { background: rgba(157,78,221,0.15); color: var(--purple); border: 1px solid var(--purple); }
  .badge-3 { background: rgba(245,197,24,0.15); color: var(--gold); border: 1px solid var(--gold); }
  .badge-4 { background: rgba(255,60,60,0.15); color: #ff6060; border: 1px solid #ff6060; }

  @media (max-width: 700px) {
    td:nth-child(5) { display: none; }
    thead th:nth-child(5) { display: none; }
    td { padding: 9px 7px; font-size: 13px; }
    td:nth-child(2) { font-size: 14px; }
  }
</style>
</head>

    ["Whimsical","WIM-zih-kul","सनकी / मज़ेदार","Add a whimsical touch to your brand.",4],
    ["Wistful","WIST-ful","उदासी भरी लालसा","He felt wistful about missed opportunities.",4],
    ["Zealot","ZEL-ut","कट्टर अनुयायी","Be passionate but not a zealot.",4],
    ["Zenith","ZEE-nith","शिखर / उच्चतम बिंदु","Reach the zenith of your potential.",4],
  ]
};

// ===================== RENDER =====================
function buildId(word) { return 'w_' + word.replace(/\s/g,'_'); }

function renderAll() {
  const container = document.getElementById('mainContent');
  let html = '';
  let totalWords = 0;

  for (const [section, words] of Object.entries(wordData)) {
    const lvl = words[0][4];
    const badge = `<span class="badge badge-${lvl}">LVL ${lvl}</span>`;
    html += `<div class="level-title">${section} ${badge}</div>`;
    html += `<table data-level="${lvl}">
      <thead><tr>
        <th>#</th>
        <th>WORD</th>
        <th>PRONUNCIATION</th>
        <th>HINDI MEANING</th>
        <th>EXAMPLE</th>
        <th>✓</th>
      </tr></thead><tbody>`;

    words.forEach((w, i) => {
      const [word, pron, hindi, example, lvl] = w;
      const id = buildId(word);
      const saved = localStorage.getItem(id) === '1';
      html += `<tr id="row_${id}" class="${saved ? 'learned' : ''}" data-level="${lvl}" data-word="${word.toLowerCase()}" data-hidden="false">
        <td>${totalWords + i + 1}</td>
        <td>${word}</td>
        <td>${pron}</td>
        <td>${hindi}</td>
        <td>${example}</td>
        <td>
          <div class="cb-wrap">
            <input type="checkbox" id="${id}" ${saved ? 'checked' : ''} onchange="toggleLearned('${id}')">
            <label class="cb-label" for="${id}">✓</label>
          </div>
        </td>
      </tr>`;
    });

    html += `</tbody></table>`;
    totalWords += words.length;
  }

  container.innerHTML = html;
  updateProgress();
}

function toggleLearned(id) {
  const cb = document.getElementById(id);
  const row = document.getElementById('row_' + id);
  if (cb.checked) {
    localStorage.setItem(id, '1');
    row.classList.add('learned');
  } else {
    localStorage.removeItem(id);
    row.classList.remove('learned');
  }
  updateProgress();
}

function updateProgress() {
  const allWords = getAllWords();
  const total = allWords.length;
  const learned = allWords.filter(w => localStorage.getItem(buildId(w)) === '1').length;
  const pct = total > 0 ? Math.round((learned / total) * 100) : 0;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${learned} / ${total} Learned`;
  document.getElementById('percentPill').textContent = pct + '%';
}

function getAllWords() {
  const all = [];
  for (const words of Object.values(wordData)) words.forEach(w => all.push(w[0]));
  return all;
}

function filterWords() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const level = document.getElementById('levelFilter').value;
  const rows = document.querySelectorAll('tbody tr');
  rows.forEach(row => {
    const word = row.getAttribute('data-word') || '';
    const lvl = row.getAttribute('data-level') || '';
    const matchSearch = !search || word.includes(search);
    const matchLevel = !level || lvl === level;
    row.setAttribute('data-hidden', !(matchSearch && matchLevel));
    row.style.display = (matchSearch && matchLevel) ? '' : 'none';
  });
}

function showOnlyUnlearned() {
  const rows = document.querySelectorAll('tbody tr');
  rows.forEach(row => {
    const id = row.id.replace('row_', '');
    const learned = localStorage.getItem(id) === '1';
    row.style.display = learned ? 'none' : '';
  });
}

function showAll() {
  const rows = document.querySelectorAll('tbody tr');
  rows.forEach(row => row.style.display = '');
  document.getElementById('searchInput').value = '';
  document.getElementById('levelFilter').value = '';
}

function resetAll() {
  if (!confirm('Reset all progress? This cannot be undone.')) return;
  getAllWords().forEach(w => localStorage.removeItem(buildId(w)));
  document.querySelectorAll('tbody tr').forEach(r => r.classList.remove('learned'));
  document.querySelectorAll('input[type=checkbox]').forEach(cb => cb.checked = false);
  updateProgress();
}

// Init
renderAll();
</script>
</body>
</html>
